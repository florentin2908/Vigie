<title>Voiture scannée Vigie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Plein écran : la voiture dans le studio Vigie ; titre en haut à gauche, commandes en bas, en verre dépoli.
   Une seule ambiance, sombre (celle de l'appli). */
:root{
  --studio:#221c74;        /* violet-bleu du studio Vigie */
  --studio-deep:#120f45;
  --ink:#f3f6fc;
  --muted:rgba(222,231,248,.74);
  --accent:#7ce3ff;        /* menthe-cyan de l'appli */
  --glass:rgba(255,255,255,.10);
  --glass-hi:rgba(255,255,255,.18);
  --stroke:rgba(255,255,255,.16);
  --font:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--studio-deep);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:linear-gradient(145deg,var(--glass-hi),var(--glass));-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--stroke);border-radius:20px;box-shadow:0 12px 32px rgba(4,3,24,.35)}
.top{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex}
.card{pointer-events:auto;padding:14px 16px 13px;max-width:440px;display:flex;flex-direction:column;gap:7px;min-width:0}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-size:clamp(22px,5.5vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.sub{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip{font:600 12px/1 var(--mono);font-variant-numeric:tabular-nums;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--ink);white-space:nowrap}
.chip b{color:var(--accent);font-weight:600}
.bottom{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hint{font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:999px;background:rgba(10,8,40,.45);border:1px solid var(--stroke);transition:opacity .6s}
.hint.off{opacity:0}
.bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:7px;max-width:100%}
button{font:700 14px/1 var(--font);color:var(--ink);background:rgba(255,255,255,.07);border:1px solid transparent;border-radius:14px;padding:10px 13px;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
button:hover{background:rgba(255,255,255,.14)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:linear-gradient(180deg,rgba(124,227,255,.32),rgba(124,227,255,.16));border-color:rgba(124,227,255,.45)}
button[aria-pressed="true"]{border-color:rgba(124,227,255,.55);background:rgba(124,227,255,.16)}
.sep{width:1px;align-self:stretch;background:var(--stroke);margin:2px 3px}
.state{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.state[hidden]{display:none}
.state p{margin:0;padding:12px 16px;font-weight:600;color:var(--ink);text-align:center;max-width:34ch}
.state .pct{font-family:var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
@media (max-width:520px){ .sep{display:none} button{padding:9px 11px;font-size:13px} .sub{font-size:13px} }
@media (prefers-reduced-motion:reduce){ .hint{transition:none} button{transition:none} }
</style>

<canvas id="gl" aria-label="Voiture scannée en 3D : glisse pour la faire tourner"></canvas>

<header class="top">
  <div class="card glass">
    <span class="eyebrow" id="eyebrow">Vigie · scan 3D</span>
    <h1>Ta voiture en 3D</h1>
    <p class="sub">Exemple : la voiture rouge de la vidéo de test, filmée en tournant puis scannée par Vigie. Avec ta vraie voiture, l'appli affiche le même rendu.</p>
    <div class="chips" id="chips"></div>
  </div>
</header>

<div class="state" id="state"><p class="glass" id="stateText">Chargement de la voiture… <span class="pct" id="pct"></span></p></div>

<nav class="bottom" aria-label="Commandes de la vue 3D">
  <span class="hint" id="hint">Glisse pour tourner · pince ou molette pour zoomer</span>
  <div class="bar glass">
    <button class="primary" id="replay" type="button">Rejouer le scanner</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-view="trois">Trois-quarts</button>
    <button type="button" data-view="profil">Profil</button>
    <button type="button" data-view="arriere">Arrière</button>
    <button type="button" data-view="dessus">Dessus</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="spin" aria-pressed="true">Rotation</button>
  </div>
</nav>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { buildScanObject } from './scan3d.js';

const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fail = msg => { $('#stateText').textContent = msg; $('#state').hidden = false; };
const lerp = (a, b, t) => a + (b - a) * t, ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, cl = t => Math.max(0, Math.min(1, t));

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, powerPreference: 'high-performance' }); }
catch (e) { fail('Ce navigateur n’affiche pas la 3D (WebGL indisponible). Essaie avec Chrome ou Safari à jour.'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

// Studio Vigie : fond dégradé, reflets d'une pièce douce, lumière principale, contre-jour violet, boîtes à lumière
const scene = new THREE.Scene();
{ const c = document.createElement('canvas'); c.width = 8; c.height = 256; const g = c.getContext('2d'), lg = g.createLinearGradient(0, 0, 0, 256);
  lg.addColorStop(0, '#120f45'); lg.addColorStop(.55, '#2b2490'); lg.addColorStop(1, '#3a2fa8'); g.fillStyle = lg; g.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
RectAreaLightUniformsLib.init();
{ const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture; pm.dispose(); }
{ const key = new THREE.DirectionalLight(0xffffff, 1.15); key.position.set(4, 6, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8f7cff, 1.6); rim.position.set(-5, 2.5, -4); scene.add(rim);
  const soft = new THREE.RectAreaLight(0xffffff, 2.2, 6.5, 1.6); soft.position.set(0, 4.2, .4); soft.lookAt(0, 0, 0); scene.add(soft);
  const side = new THREE.RectAreaLight(0xdfe9ff, 1.2, 4.5, 1.2); side.position.set(.5, 1.6, 4.5); side.lookAt(0, .7, 0); scene.add(side);
  scene.add(new THREE.AmbientLight(0x8fb4ff, .22)); }

// Sol : halo lavande sous la voiture et ellipses fines, comme sur l'accueil de l'appli
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
  uniforms: { uCol: { value: new THREE.Color('#c9c3ff') } },
  vertexShader: 'varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader: 'uniform vec3 uCol;varying vec2 vP;void main(){float r=length(vP*vec2(.62,1.0));float a=.42*exp(-r*r*.55)+.08*exp(-r*.35);gl_FragColor=vec4(uCol*a,a);}' }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const rings = new THREE.Group(); scene.add(rings);

const cam = new THREE.PerspectiveCamera(32, 1, .1, 100);
const controls = new OrbitControls(cam, renderer.domElement);
Object.assign(controls, { enableDamping: true, dampingFactor: .08, enablePan: false, minDistance: 3.2, maxDistance: 24, maxPolarAngle: Math.PI * .485, autoRotate: !reduce, autoRotateSpeed: .7 });
controls.target.set(0, .62, 0);
const spinBtn = $('#spin'); spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
spinBtn.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute('aria-pressed', String(controls.autoRotate)); });
controls.addEventListener('start', () => { $('#hint').classList.add('off'); tween = null;
  if (controls.autoRotate) { controls.autoRotate = false; spinBtn.setAttribute('aria-pressed', 'false'); } });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.fov = cam.aspect < 1 ? 46 : 32; cam.updateProjectionMatrix(); }   // écran en hauteur : champ plus large
addEventListener('resize', resize); resize();

// Chargement : maillage (sommets, normales, coordonnées de texture, triangles, masque des vitres) et texture cuite
async function fetchBuf(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url);
  // taille annoncée seulement indicative (un fichier texte peut arriver compressé) : morceaux mis bout à bout
  const total = +r.headers.get('content-length') || 0; if (!r.body) return r.arrayBuffer();
  const rd = r.body.getReader(), parts = []; let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; if (total) $('#pct').textContent = Math.min(99, Math.round(got / total * 100)) + ' %'; }
  const out = new Uint8Array(got); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out.buffer;
}
let obj, dims, tween = null, scanT0 = null, ringScan;
try {
  // la voiture est rangée en texte base64 (les artefacts ne servent pas de fichier binaire brut)
  const [b64, tex] = await Promise.all([fetchBuf('voiture.b64.txt'), fetch('texture.jpg').then(r => { if (!r.ok) throw new Error('texture'); return r.blob(); })]);
  const bs = atob(new TextDecoder().decode(b64)), bin = new ArrayBuffer(bs.length), bu = new Uint8Array(bin); for (let i = 0; i < bs.length; i++) bu[i] = bs.charCodeAt(i);
  const dv = new DataView(bin); if (dv.getUint32(0, true) !== 0x33474956) throw new Error('format');
  const hl = dv.getUint32(4, true), head = JSON.parse(new TextDecoder().decode(new Uint8Array(bin, 8, hl)).replace(/\0+$/, ''));
  let o = 8 + hl; const take = (C, n) => { const a = new C(bin, o, n); o += n * C.BYTES_PER_ELEMENT; o += (4 - o % 4) % 4; return a; };
  const nV = head.nV, nT = head.nT;
  const mesh = { pos: take(Float32Array, nV * 3), nrm: take(Int8Array, nV * 3), uv: take(Uint16Array, nV * 2), idx: take(Uint16Array, nT * 3), glass: take(Uint8Array, nV) };
  obj = await buildScanObject(THREE, null, { v: 3, mesh, tex, dims: head.dims, wheels: head.wheels, front: head.front, paint: head.paint });
  dims = head.dims; scene.add(obj.group);
  if (head.version) document.getElementById('eyebrow').textContent = 'Vigie · scan 3D v' + head.version;
  // anneaux au sol à la taille de la voiture, et anneau du scanner
  const rx = dims.L / 2 + .35, rz = dims.W / 2 + .35;
  for (const [k, op] of [[1, .55], [1.32, .3], [1.75, .16]]) { const r = new THREE.Mesh(new THREE.RingGeometry(.992, 1, 160), new THREE.MeshBasicMaterial({ color: 0xc9c3ff, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide }));
    r.rotation.x = -Math.PI / 2; r.position.y = .004; r.scale.set(rx * k, rz * k, 1); rings.add(r); }
  ringScan = new THREE.Mesh(new THREE.RingGeometry(.965, 1, 160), new THREE.MeshBasicMaterial({ color: 0x9fe9ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  ringScan.rotation.x = -Math.PI / 2; ringScan.scale.set(rx, rz, 1); scene.add(ringScan);
  const fr = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }), cal = head.calage || {};
  $('#chips').innerHTML = `<span class="chip"><b>${fr(dims.L)} × ${fr(dims.W)} × ${fr(dims.H)}</b> m</span><span class="chip">${nT.toLocaleString('fr-FR')} triangles</span>`
    + `<span class="chip">texture 2048 px</span>` + (cal.garde ? `<span class="chip">caméras calées · ${(cal.points || 0).toLocaleString('fr-FR')} points</span>` : '');
  $('#state').hidden = true;
  go('trois', true);
  if (!reduce) replay();
} catch (e) { fail('La voiture n’a pas pu être chargée. Recharge la page.'); console.error(e); }

// Vues : la voiture regarde vers +x
function viewPose(name) {
  const tv = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)), fit = 1.12 * Math.max((dims.L + 1.8) / 2 / (tv * cam.aspect), (dims.H + 1.8) / 2 / tv);
  const V = { trois: [32, 15, 1], profil: [90, 6, 1], arriere: [212, 13, 1], dessus: [90, 80, 1.05] }[name], az = THREE.MathUtils.degToRad(V[0]), el = THREE.MathUtils.degToRad(V[1]), d = Math.min(22, fit * V[2]);
  return new THREE.Vector3(Math.cos(az) * Math.cos(el) * d, .62 + Math.sin(el) * d, Math.sin(az) * Math.cos(el) * d);
}
function go(name, now) {
  if (!dims) return; const to = viewPose(name);
  if (now || reduce) { cam.position.copy(to); controls.update(); return; }
  tween = { from: cam.position.clone(), to, t0: performance.now() };
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  if (controls.autoRotate) { controls.autoRotate = false; spinBtn.setAttribute('aria-pressed', 'false'); }
  go(b.dataset.view); }));
function replay() { if (!obj) return; if (reduce) { obj.reveal.uReveal.value = 99; obj.reveal.uScan.value = 0; return; } scanT0 = performance.now(); }
$('#replay').addEventListener('click', replay);

renderer.setAnimationLoop(now => {
  if (tween) { const t = cl((now - tween.t0) / 900), e = ease(t);
    // passage en arc autour de la voiture plutôt qu'en ligne droite à travers elle
    const a = new THREE.Spherical().setFromVector3(tween.from.clone().sub(controls.target)), b = new THREE.Spherical().setFromVector3(tween.to.clone().sub(controls.target));
    let dt = b.theta - a.theta; if (dt > Math.PI) dt -= 2 * Math.PI; if (dt < -Math.PI) dt += 2 * Math.PI;
    const s = new THREE.Spherical(lerp(a.radius, b.radius, e), lerp(a.phi, b.phi, e), a.theta + dt * e);
    cam.position.setFromSpherical(s).add(controls.target); if (t >= 1) tween = null; }
  if (obj && scanT0 !== null) { const t = (now - scanT0) / 2600, H = dims.H;
    const y = lerp(-.05, H + .1, ease(cl(t)));
    obj.reveal.uReveal.value = t < 1 ? y : 99; obj.reveal.uScan.value = t < 1 ? 1 : Math.max(0, 1 - (t - 1) * 4);
    ringScan.position.y = y; ringScan.material.opacity = t < 1 ? .85 * Math.sin(Math.PI * cl(t)) : 0;
    if (t > 1.3) scanT0 = null; }
  controls.update();
  renderer.render(scene, cam);
});
</script>
